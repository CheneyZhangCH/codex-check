<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c23b22">
  <title>习惯打卡</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='12' width='76' height='76' rx='18' fill='%23c23b22' transform='rotate(-6 50 50)'/><path d='M32 52l13 13 26-28' fill='none' stroke='white' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-seal">✓</span>习惯打卡</div>
      <nav class="tabs">
        <button class="tab active" data-action="tab" data-tab="today">今天</button>
        <button class="tab" data-action="tab" data-tab="month">月视图</button>
        <button class="tab" data-action="tab" data-tab="year">年视图</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section id="view-today" class="view"></section>
    <section id="view-month" class="view hidden"></section>
    <section id="view-year" class="view hidden"></section>
  </main>

  <footer class="footer">
    <span>数据保存在本机浏览器 · 换设备可用「导出 / 导入」迁移</span>
    <span class="actions">
      <button class="link-btn" data-action="export">导出数据</button>
      <button class="link-btn" data-action="import">导入数据</button>
    </span>
  </footer>

  <div id="modal-root" class="modal-root hidden">
    <div class="modal" id="modal-body"></div>
  </div>
  <div id="toast" class="toast"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
